<!doctype html>
<html lang="ua">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Курс HTML</title>
  </head>
  <body>
    <h2>Курс HTML для початківців</h2>
    <div>
      <a href="index.html">Головна</a>
      <a href="lessons.html">Тут</a>
      <a href="contacts.html">Натиснути тут</a>
    </div>
    <h4>Про курс</h4>
    <img src="students.jpg" />
    <p>На курсі ви навчитеся створювати вебсторінки.</p>
    <h4>Реєстрація</h4>

    <form>
      <br />

      <label for="username">Iм'я</label>
      <!--Перевірка імені користувача-->
      <input
        type="text"
        id="username"
        name="username"
        required
        placeholder="Іван"
      />
      <br />

      <br />
      <label for="email">Електронна пошта</label>
      <!--Перевірка email-->
      <input
        type="email"
        id="email"
        name="email"
        required
        placeholder="example@gmail.com"
      />

      <br />
      <br />

      <button>Зареєструватися</button>
    </form>
  </body>
</html>
