<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <form>
        <label for="username">Iм'я та Прізвище</label> <!--Перевірка імені та прізвища користувача--> 
        <input 
        type="text" 
        id="username" 
        name="username" 
        required placeholder="Іван Іванович">
        

        <br>

         <label for="email">Електронна пошта</label> <!--Перевірка email-->
        <input 
        type="email"
        id="email"
        name="email"
        required placeholder="example@gmail.com"
        >

         <br>

        <label for="phone">Телефон</label> <!--Перевірка телефону-->
        <input 
        type="tel"
        id="phone"
        name="phone"
        required placeholder="+38000000000"
        maxlength="13"
        >

       <br>

        <label for="age">Вік</label> <!--Перевірка віку-->
        <input
        type="number"
        id="age"
        name="age"
        min="14"
        max="70"
        required placeholder="20"
        >

         <br>

        <label for="date">Дата народження</label> <!--Перевірка дати народження-->
        <input
        type="date"
        id="date"
        name="date"

        >
        
        <br>

        <label for="password">Пароль</label> <!--Перевірка пароля-->
        <input 
        type="password"
        id="password"
        name="password"
         required placeholder="********"
        minlength="8"
        >

        <br>

        <label for="confirm_password">Підтвердження пароля</label> <!--Підтвердження пароля-->
        <input 
        type="password"
        id="confirm_password"
        name="confirm_password"
         required placeholder="Підтвердження пароля"
        minlength="8"
        >


        <!--Рівень підготовки-->
        <div class="form-group">
            <label>Рівень підготовки </label>
            <div class="radio-group">
            <label><input type="radio" name="level" value="beginner" required> Початковий</label>
            <label><input type="radio" name="level" value="intermediate"> Середній</label>
            <label><input type="radio" name="level" value="advanced"> Високий</label> 
            </div>
        </div>

        <!-- Теми які цікавлять (Checkbox) -->
        <div class="form-group">
            <label>Теми, які вас цікавлять</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="topics[]" value="HTML"> HTML</label>
                <label><input type="checkbox" name="topics[]" value="CSS"> CSS</label>
                <label><input type="checkbox" name="topics[]" value="JavaScript"> JavaScript</label>
                <label><input type="checkbox" name="topics[]" value="Angular"> Angular</label>
            </div>
        </div>

        <div class="form-group">
            <label>Виберіть бажаний формат навчання </label>
            <div class="radio-group">
            <label><input type="radio" name="form" value="online" required> Онлайн</label>
            <label><input type="radio" name="form" value="offline"> Офлайн</label>
            <label><input type="radio" name="form" value="mixed"> Змішаний</label> 
            </div>
        </div>

        <br>
        <label for="motivation">Чому ви хочете пройти цей курс? (макс. 300 символів)</label>
        <textarea style="align-items: center;"
        name="message" 
        id="message" 
        cols="50" 
        rows="20" 
        required placeholder="Чому ви хочете пройти цей курс?"
        maxlength="300"
        ></textarea> <!--Чому ви хочете пройти цей курс? (макс. 300 символів)-->

        <
       
        <br>
        <!--Кнопка відправки форуму-->
        <button type="submit">Зареєструватися</button>
</form>
</body>
