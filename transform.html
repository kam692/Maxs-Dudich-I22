<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Page</title>
    <link rel="stylesheet" href="transform.css" />
  </head>
  <body>
    <div class="product-card">
      <!-- Позначка «Акція» з нескінченною анімацією пульсації -->
      <span class="badge-promo">Акція</span>

      <div class="product-image">
        <img src="gbl.webp" alt="Зображення навушників GBL" />
      </div>

      <div class="product-info">
        <h2 class="product-title">Бездротові навушники</h2>
        <p class="product-description">
          Якісний звук, стильний дизайн та тривала автономність роботи.
        </p>

        <div class="product-footer">
          <span class="product-price">8 999 ₴</span>
          <button class="btn-buy">Купити</button>
        </div>
      </div>
    </div>
  </body>
</html>
